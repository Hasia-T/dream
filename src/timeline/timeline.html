<div class="card">
    <p-timeline [value]="events" align="alternate" class="customized-timeline">
        <ng-template #marker let-event>
            <!-- <span class="flex w-8 h-8 items-center justify-center text-white rounded-full z-10 shadow-sm" [style]="'background-color: white'"> -->
                <i class="pi pi-heart" style="color: white;"></i>
            <!-- </span> -->
        </ng-template>
        <ng-template #content let-event>
            <p-card class="timelineCard">
                <ng-template #title> {{ event.status }} </ng-template>

                <img *ngIf="event.image" [src]="'../images/' + event.image" [alt]="event.name" width="200"
                    class="w-full" />
                <p class="text">
                    {{ event.description }}
                </p>
            </p-card>
        </ng-template>
    </p-timeline>
</div>
